<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const FADE_MS = 500;
const FADE_OUT_LEAD = 0.55;

window.FadingVideo = ({ src, className, style }) => {
  const videoRef = useRef(null);
  const rafIdRef = useRef(null);
  const fadingOutRef = useRef(false);
  const mountedRef = useRef(true);

  const fadeTo = useCallback((target, duration) => {
    cancelAnimationFrame(rafIdRef.current);
    const video = videoRef.current;
    if (!video) return;
    const startOpacity = parseFloat(video.style.opacity) || 0;
    const startTime = performance.now();
    function animate(now) {
      if (!mountedRef.current) return;
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      video.style.opacity = String(startOpacity + (target - startOpacity) * eased);
      if (progress < 1) rafIdRef.current = requestAnimationFrame(animate);
    }
    rafIdRef.current = requestAnimationFrame(animate);
  }, []);

  useEffect(() => {
    mountedRef.current = true;
    const video = videoRef.current;
    if (!video) return;

    function onLoadedData() {
      video.style.opacity = "0";
      video.play().then(() => fadeTo(1, FADE_MS)).catch(() => {});
    }
    function onTimeUpdate() {
      const diff = video.duration - video.currentTime;
      if (!fadingOutRef.current && diff <= FADE_OUT_LEAD && diff > 0) {
        fadingOutRef.current = true;
        fadeTo(0, FADE_MS);
      }
    }
    function onEnded() {
      video.style.opacity = "0";
      setTimeout(() => {
        video.currentTime = 0;
        video.play().then(() => {
          fadingOutRef.current = false;
          fadeTo(1, FADE_MS);
        }).catch(() => {});
      }, 100);
    }

    video.addEventListener("loadeddata", onLoadedData);
    video.addEventListener("timeupdate", onTimeUpdate);
    video.addEventListener("ended", onEnded);

    return () => {
      mountedRef.current = false;
      cancelAnimationFrame(rafIdRef.current);
      video.removeEventListener("loadeddata", onLoadedData);
      video.removeEventListener("timeupdate", onTimeUpdate);
      video.removeEventListener("ended", onEnded);
    };
  }, [fadeTo]);

  return (
    <video
      ref={videoRef}
      src={src}
      autoPlay muted playsInline preload="auto"
      className={className}
      style={{ ...style, opacity: 0 }}
    />
  );
};
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

window.BlurText = ({ text, className }) => {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setVisible(true); obs.disconnect(); } },
      { threshold: 0.1 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  const words = text.split(" ");
  return (
    <p ref={ref} className={className}
      style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}
    >
      {words.map((word, i) => (
        <span key={i}
          className={"word-word" + (visible ? " animating" : "")}
          style={{ animationDelay: visible ? ((i * 100) / 1000) + "s" : "0s" }}
        >{word}</span>
      ))}
    </p>
  );
};
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function useHeroFadeIn(delay) {

  useEffect(() => {

}

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function InView({ delay = 0, children, className = "", as: TagName = "div", ...rest }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setVisible(true); obs.disconnect(); } },
      { threshold: 0.1 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  const cls = className + (visible ? " in" : "");
  const delayStyle = visible ? { transitionDelay: delay + "s" } : {};
  const content = rest.dangerouslySetInnerHTML ? null : children;
  return <TagName ref={ref} className={cls} style={delayStyle} {...rest}>{content}</TagName>;
}

      tags: ["Scale Fast","Visual Consistency","Time Saver","Ready to Post"],

    },
    {
      title: "Smart Lighting",
      icon: "M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1Zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7Z",
      tags: ["Ray Tracing","Physical Shadows","Studio Quality","Sunlight Sync"],
      body: "Automatic lighting and material adjustment. Achieve flawless integration with realistic shadows and sunlight.",
    },
  ];

  return (
    <section className="relative min-h-screen overflow-hidden">
      <FadingVideo
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4"
        className="absolute inset-0 w-full h-full object-cover z-0"
      />
      <div className="relative z-10 px-8 md:px-16 lg:px-20 pt-24 pb-10 flex flex-col min-h-screen">
        <div className="mb-auto">
          <InView as="p" className="fade-inview text-sm font-body text-white/60 mb-6">
            // Capabilities
          </InView>
          <InView as="h2" delay={0.2} className="fade-inview font-heading italic text-white text-6xl md:text-7xl lg:text-[6rem] leading-[0.9] tracking-[-3px]"
            dangerouslySetInnerHTML={{ __html: "Production<br/>evolved" }}
          />
        </div>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16">
          {cards.map((card, i) => (
            <InView key={card.title} delay={0.3 + i * 0.15} className="fade-card liquid-glass rounded-[1.25rem] p-6 flex flex-col min-h-[360px]">
              <div className="flex items-start justify-between gap-4">
                <div className="w-11 h-11 liquid-glass rounded-[0.75rem] flex items-center justify-center shrink-0">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" className="h-6 w-6 text-white">

                  </svg>
                </div>
                <div className="flex flex-wrap justify-end gap-1.5 max-w-[70%]">
                  {card.tags.map((tag) => (
                    <span key={tag} className="liquid-glass rounded-full px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap">{tag}</span>
                  ))}
                </div>
              </div>
              <div className="flex-1" />
              <div className="mt-6">
                <h3 className="font-heading italic text-white text-3xl md:text-4xl tracking-[-1px] leading-none">{card.title}</h3>
                <p className="mt-3 text-sm text-white/90 font-body font-light leading-snug max-w-[32ch]">{card.body}</p>

</script>

<script type="text/babel">
window.App = () => React.createElement(React.Fragment, null,
  React.createElement(window.HeroSection),
  React.createElement(window.CapabilitiesSection)

</script>
